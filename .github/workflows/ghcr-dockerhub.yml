# 手动补发镜像的薄封装：复用 Docker Release Publish（docker-publish.yml）的完整流程，
# 包括后端测试 gate、标注 tag 校验、GHCR + Docker Hub 双仓库多架构推送。
# 与旧版内联实现的差异：
# 1. image_tag 必须是已存在的 v*.*.* 语义化标注 git tag（发布前会用 git rev-parse 校验），
#    不再支持无门槛的任意 tag 发布。
# 2. 镜像从该 tag 检出的源码构建（旧版从 dispatch 时的默认分支 HEAD 构建）。
name: Docker Manual Publish

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Release tag in semver format, e.g. v3.0.6 (must be an existing annotated git tag)'
        required: true
        default: 'v1.0.0'
        type: string

concurrency:
  group: docker-manual-publish-${{ github.ref }}-${{ inputs.image_tag }}
  cancel-in-progress: true

jobs:
  publish:
    uses: ./.github/workflows/docker-publish.yml
    with:
      release_tag: ${{ inputs.image_tag }}
    secrets: inherit
